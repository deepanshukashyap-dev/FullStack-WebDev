<!DOCTYPE html>
<html lang="en">
<head>
   <title>Document</title>
   <style>
    *{margin:0;
    padding:0;}

    .container{
        width:100vw;
        height: 100vh;
        /* display: flex;
        justify-content:center;
        align-items: center; */
        background-color: rgba(145, 223, 197, 0.733);
    }
    .card{
        background-color: aliceblue;
        display:flex;
        flex-direction: column;
        
        align-items: center;
        width:350px;
        height:570px;
        border-radius:20px;
        padding: 10px;
        margin: auto;
    }
    
    .lower h2{margin:10px; font-weight: bolder;}
    .lower p{margin:10px; }


    img{
        padding:10px;
        height:90%;
        width:340px;
        border-top-left-radius:20px ;
        border-top-right-radius:20px ;
    }
   </style>

</head>

<body>
    <div class="container">
        <div class="card">
            <div class="upper">
                <img src="qrcode.png" alt="">
            </div>
            
            <div class="lower">
                <h2>Improving your frontend skills by building projects</h2>
                <br>
                
                <p>Scan the Qr code to get the frontend mentor dev which brings your skills the next level Lorem ipsum dolor sit amet.</p>

            </div>

        </div>
    </div>
    
</body>
</html>
