<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>

        *{margin: 0;padding:0;}

        .upper{border: 2px solid black;width: 250px; height:60px; background-color: blueviolet; border-radius :56px; margin:6px;
              position: relative;  /*is se keyframes add kar sakte hai ki currect state se next state par khah jana.*/
        
        animation-duration:4s;
       animation-delay: 1s;
        animation-iteration-count: infinite;
        animation-name: box_game;
        animation-timing-function: linear;
        animation-direction: alternate;
        }
        .lower{
       border: 2px solid black;width: 250px; height:60px; background-color: blueviolet; border-radius :56px; margin:6px;
       position: relative;  /*is se keyframes add kar sakte hai ki currect state se next state par khah jana.*/
      
      animation-duration:4s;
      animation-delay: 1s;
      animation-iteration-count: infinite;
      animation-name: box1_game;
      animation-timing-function: linear;
      animation-direction: alternate;
      animation-play-state: running;
      }
        .circle {
            width: 30px;
            height: 30px;
            border: 2px solid black;
            border-radius: 50%;
            background-color: yellow;
            position: absolute;
            left: 640px;

            animation: circle 4s linear infinite alternate;
        }
         
        
     


   

        @keyframes box_game
        {
            from{top:0; left: 10px;}
            to{top: 0;left:1200px;}
        }
        @keyframes box1_game
        {
            from{top: 680px; left: 1200px;}
            to{top:680px;left:10px;}
        }
        @keyframes circle {
            0% {
                top: 70px; /* Matches the position slightly below the upper box */
            }
            50% {
                top: calc(100% - 100px); /* Matches the position slightly above the lower box */
            }
            100% {
                top: 70px; 
            }
        }
        

    </style>

    
</head>


<body >
  <div class="upper"></div>  
  <div class="lower"></div> 
  <div class="circle"></div> 
    
</body>
</html>
