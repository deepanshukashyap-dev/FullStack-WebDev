    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Know Your Health Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        input[type="number"]::placeholder {
            color: #999;
            font-style: italic;
        }



        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            animation: fadeIn 0.5s ease;
            /* color: black; */
        }
        .result{
             color: black;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result.show {
            display: block;
        }

        .bmi-value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .bmi-category {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .bmi-description {
            font-size: 1rem;
            line-height: 1.5;
        }

        .underweight {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }

        .normal {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
        }

        .overweight {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            color: white;
        }

        .obese {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
        }

        .bmi-scale {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: left;
        }

        .scale-title {
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }

        .scale-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #e1e5e9;
        }

        .scale-item:last-child {
            border-bottom: none;
        }

        .scale-range {
            font-weight: 600;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .bmi-value {
                font-size: 2.5rem;
            }

            .unit-selector {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .container {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <p class="subtitle">Calculate your Body Mass Index and discover your health status instantly</p>
        
        <form id="bmiForm">
            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" step="0.1" min="1" max="500" required placeholder="Enter your weight in kilograms"> 
            </div>

            <div class="form-group">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" step="0.1" min="1" max="250" required placeholder="Enter your height in centimeters">
            </div>

            <button type="submit" class="submit-btn">Calculate BMI</button>
        </form>

        <div id="result">
            <span class="result" ></span>
        </div>

        <div class="bmi-scale">
            <div class="scale-title">BMI Categories</div>
            <div class="scale-item">
                <span>Underweight</span>
                <span class="scale-range">&lt; 18.5</span>
            </div>
            <div class="scale-item">
                <span>Normal weight</span>
                <span class="scale-range">18.5 - 24.9</span>
            </div>
            <div class="scale-item">
                <span>Overweight</span>
                <span class="scale-range">25 - 29.9</span>
            </div>
            <div class="scale-item">
                <span>Obese</span>
                <span class="scale-range">&gt; 30</span>
            </div>
        </div>
    </div>

</body>
<script src="script.js" ></script>
</html>
