function addLang(langName){
    const li = document.createElement('li');
    li.appendChild(document.createTextNode(langName));  //inserting text node
    document.querySelector('.lang').appendChild(li) //in single line
}

console.log(document.querySelector('li:nth-child(2)'))

const secondLang = document.querySelector('li:nth-child(2)')  //select 2nd li 
const newLi = document.createElement('li')                    //create new li
newLi.textContent = "pawa"                                    // replace old with new
secondLang.replaceWith(newLi)

const second = document.querySelector('li:nth-child(2)')
